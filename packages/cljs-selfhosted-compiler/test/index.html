<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>cljs-selfhosted-compiler — test harness</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; padding: 18px; background: #14161a; color: #e6e8eb;
        font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      h1 { font-size: 14px; margin: 0 0 12px; font-weight: 600; }
      h1 span { color: #5880ff; }
      pre { white-space: pre-wrap; word-break: break-word; margin: 0; }
      .hint { color: #8b93a1; font-size: 11px; margin-bottom: 14px; }
    </style>
  </head>
  <body>
    <h1>cljs-selfhosted-compiler <span>&rarr;</span> test harness</h1>
    <p class="hint">
      Compiles in a classic worker (no DOM), then runs the returned JavaScript in this page against
      <code>dist/cljs-runtime.js</code> only.
    </p>
    <p><button id="run">Run</button></p>
    <pre id="report">not run yet</pre>
    <!-- The page-side runtime. Note: no compiler is loaded here. -->
    <script src="../dist/cljs-runtime.js"></script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
